[project]
name = "ai-agents-and-harnesses-foundations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alfred Tan", email = "alfredtanhb@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.5.2",
    "langchain-mistralai>=1.2.0",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
ai-agents-and-harnesses-foundations = "ai_agents_and_harnesses_foundations:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
